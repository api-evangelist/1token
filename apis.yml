apis:
- name: 1Token 1ndex Public Strategy Overview API
  description: >-
    Anonymous, read-only REST API returning the aggregate 1ndex strategy overview — current platform
    statistics (investors, strategies, trading teams), per-strategy-type summaries (accumulated NAV
    and PnL, period and annualized PnL, Sharpe ratio, max drawdown) and historical time-series points.
    One GET operation, no authentication, optional start_time/end_time (nanosecond Unix timestamps)
    and strategy_type filters. Provided best-effort with no SLA and no advertised request quota.
  image: https://1token.tech/images/og/1token-og.png
  humanURL: https://1token.tech/api/1ndex/v1/README.md
