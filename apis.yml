aid: 1token
name: 1Token
description: >-
  1Token builds institutional digital asset infrastructure for crypto funds, fund-of-funds, prime
  brokers, lenders, fund platforms, fund administrators and auditors. Its main platform, 1Token CAM,
  covers post-trade portfolio management, real-time risk (PnL, exposure, Greeks, collateral, alerts,
  stress testing, VaR), exchange/custody/wallet data collection and trade reconciliation, performance
  intelligence and verification, and investor-ready analysis and reporting across 84 CeFi venues, 164
  DeFi chains and 4,290 DeFi protocols. A sister platform, 1Token 1ndex, is an institutional crypto
  strategy discovery service for allocators and trading teams. 1Token publishes exactly one supported
  public API — an anonymous, read-only 1ndex strategy overview endpoint described by an OpenAPI 3.1.1
  document and discoverable through an RFC 9727 API Catalog at the domain root; the CAM product
  interfaces are documented behind a customer login.
