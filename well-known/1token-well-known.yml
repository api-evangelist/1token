source: live probes of the named /.well-known/ path list on every 1Token host
summary: >-
  One real document is served, on the apex and www hosts: an RFC 9727 API Catalog
  (application/linkset+json) at https://1token.tech/.well-known/api-catalog. It resolves the public
  1ndex endpoint to its OpenAPI description and its markdown documentation, and it is the discovery
  root 1Token's own llms.txt points at. Nothing else is served anywhere on any host: no security.txt
  (so NO SecurityTxt pointer), no OIDC discovery, no OAuth metadata, no ai-plugin.json, no
  apis.json, no AAuth resource, and no A2A agent card.
pointer_basis: >-
  WellKnown pointer earned on the strength of the parsed api-catalog linkset on 1token.tech and
  www.1token.tech. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every host.
false_positive_watch: >-
  1ndex.1token.tech answers HTTP 200 with a 1,182-byte dark-mode SPA shell for EVERY /.well-known/*
  path, including the negative control that cannot exist. Its path_echo/soft-404 control therefore
  FAILED and every 200 on that host is recorded below as a miss, not a hit. Any future round that
  treats a 1ndex.1token.tech /.well-known/ 200 as a served document is wrong.
