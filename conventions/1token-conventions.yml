summary: >-
  The public 1Token surface is a single anonymous, read-only GET. That makes most runtime-semantics
  dimensions genuinely not-applicable rather than absent, and the two that do apply — timestamp
  precision and the error envelope — are documented unusually precisely for a one-operation API.
