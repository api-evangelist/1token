  style: none
  detail: Anonymous. See authentication/1token-authentication.yml.
versioning:
  scheme: uri-path
  current: v1
  evidence: 'servers[0].url https://1ndex.1token.tech/api/v1; docs titled "... API v1"'
  docs: https://1token.tech/api/1ndex/v1/README.md
  note: No published version-support or deprecation policy. See lifecycle/1token-lifecycle.yml.
pagination:
  style: none
  detail: >-
    No pagination. The single operation returns the full aggregate document; the documented way to
    limit response size is the optional start_time/end_time history window and the strategy_type
    filter.
  params: [start_time, end_time, strategy_type]
filtering:
  params:
  - name: start_time
    type: integer(int64)
    detail: Start of the requested history window, Unix timestamp in NANOSECONDS.
  - name: end_time
    type: integer(int64)
    detail: End of the requested history window, Unix timestamp in NANOSECONDS.
  - name: strategy_type
    type: string
    detail: 'Strategy type filter, e.g. DeltaNeutral. Explicitly NOT declared as a fixed enum.'
timestamps:
  precision: nanoseconds
  hazard: >-
    time / update_time are 19-digit nanosecond Unix timestamps and exceed JavaScript's safe-integer
    range. The provider documents the mitigation: JavaScript clients should read the sibling
    time_str / update_time_str fields, which are UTC RFC 3339 strings.
  rfc3339_fields: [time_str, update_time_str]
  docs: https://1token.tech/api/1ndex/v1/README.md
error_envelope:
  format: custom-json
  shape: '{ "code": "<string>", "message": "<string>" }'
  problem_json: false
  detail: >-
    Not RFC 9457. A stable top-level two-field JSON object; both fields are required in the schema.
  observed:
