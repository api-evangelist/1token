    `Idempotency-Key` in access-control-allow-headers, but that is a shared gateway CORS
    configuration, not a documented idempotency contract for this endpoint; no Idempotency-Key
    header is described in the spec or the docs, so NO `Idempotency` pointer is emitted.
  scope: []
